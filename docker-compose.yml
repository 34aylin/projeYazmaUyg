services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "30206:30206"
    volumes:
      - /opt/proje-marta-tr/data:/app/data
    environment:
      - JWT_SECRET=${JWT_SECRET:-proje-marta-jwt-secret-degistir}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    restart: unless-stopped
    networks:
      - proje

  frontend:
    build:
      context: frontend
      dockerfile: Dockerfile
    ports:
      - "30205:30205"
    environment:
      - NODE_ENV=production
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - proje

networks:
  proje:
    driver: bridge
