services:
  frontend:
    build:
      context: frontend
      dockerfile: Dockerfile
    ports:
      - "30205:30205"
    volumes:
      - /opt/proje-marta-tr/data:/app/data
    environment:
      - NODE_ENV=production
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET tanımlanmalı}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    restart: unless-stopped
    networks:
      - proje

networks:
  proje:
    driver: bridge
